<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APEX STRATEGY | Quiz Publicitario</title>
  <style>
    :root{
      --bg:#090b10;
      --panel:#11141c;
      --panel2:#171b25;
      --text:#f5f7fb;
      --muted:#9ca5b5;
      --blue:#2da8ff;
      --violet:#7b55ff;
      --line:#252b38;
      --green:#25d366;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:
        radial-gradient(circle at 15% 10%,rgba(45,168,255,.14),transparent 30%),
        radial-gradient(circle at 85% 15%,rgba(123,85,255,.16),transparent 28%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
    }
    .wrap{width:min(980px,92%);margin:auto}
    header{
      padding:28px 0;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid var(--line);
    }
    .logo{
      font-size:25px;
      font-weight:900;
      letter-spacing:2px;
    }
    .tag{
      color:var(--muted);
      font-size:11px;
      letter-spacing:2px;
      margin-top:5px;
    }
    .badge{
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      padding:9px 13px;
      border-radius:30px;
      font-size:11px;
      letter-spacing:1px;
    }
    .hero{
      padding:72px 0 38px;
      text-align:center;
    }
    .kicker{
      color:var(--blue);
      font-size:12px;
      font-weight:bold;
      letter-spacing:3px;
      margin-bottom:18px;
    }
    h1{
      font-size:clamp(42px,8vw,78px);
      line-height:.95;
      margin:0 auto 22px;
      max-width:850px;
      letter-spacing:-3px;
    }
    .hero p{
      color:var(--muted);
      max-width:650px;
      margin:0 auto 30px;
      line-height:1.7;
      font-size:16px;
    }
    .btn{
      border:0;
      border-radius:13px;
      padding:15px 22px;
      color:white;
      background:linear-gradient(135deg,var(--blue),var(--violet));
      font-weight:800;
      cursor:pointer;
      font-size:14px;
      box-shadow:0 12px 35px rgba(45,168,255,.15);
      transition:.2s;
    }
    .btn:hover{transform:translateY(-2px)}
    .secondary{
      background:transparent;
      border:1px solid var(--line);
      box-shadow:none;
      color:var(--text);
    }
    .quiz,.result{
      display:none;
      padding:25px 0 70px;
    }
    .quiz.active,.result.active{display:block}
    .quiz-card{
      background:rgba(17,20,28,.92);
      border:1px solid var(--line);
      border-radius:24px;
      padding:28px;
      max-width:760px;
      margin:auto;
    }
    .progress{
      height:6px;
      background:#202530;
      border-radius:20px;
      overflow:hidden;
      margin-bottom:28px;
    }
    .progress span{
      display:block;
      height:100%;
      width:25%;
      background:linear-gradient(90deg,var(--blue),var(--violet));
      transition:.3s;
    }
    .counter{
      color:var(--muted);
      font-size:12px;
      letter-spacing:2px;
      margin-bottom:12px;
    }
    h2{
      font-size:clamp(27px,5vw,43px);
      margin:0 0 25px;
      line-height:1.08;
    }
    .answers{
      display:grid;
      gap:12px;
    }
    .answer{
      width:100%;
      text-align:left;
      padding:18px;
      border-radius:15px;
      background:var(--panel2);
      border:1px solid var(--line);
      color:var(--text);
      cursor:pointer;
      font-size:15px;
      transition:.2s;
    }
    .answer:hover{
      border-color:var(--blue);
      transform:translateX(4px);
    }
    .answer small{
      display:block;
      color:var(--muted);
      margin-top:5px;
    }
    .result-box{
      max-width:760px;
      margin:auto;
      padding:38px;
      background:linear-gradient(145deg,#121722,#18152a);
      border:1px solid var(--line);
      border-radius:25px;
      text-align:center;
    }
    .result-label{
      color:var(--blue);
      letter-spacing:3px;
      font-size:12px;
      font-weight:bold;
    }
    .service{
      font-size:clamp(32px,6vw,55px);
      margin:14px 0;
    }
    .result-box p{
      color:var(--muted);
      line-height:1.7;
      max-width:600px;
      margin:0 auto 24px;
    }
    .chips{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:center;
      margin-bottom:28px;
    }
    .chip{
      padding:8px 12px;
      border-radius:30px;
      border:1px solid var(--line);
      color:#cbd2df;
      font-size:12px;
    }
    .wa{
      background:var(--green);
      color:#07130b;
      box-shadow:0 10px 30px rgba(37,211,102,.18);
      margin-right:8px;
    }
    footer{
      padding:25px 0 40px;
      text-align:center;
      color:#6f7787;
      font-size:12px;
    }
    @media(max-width:600px){
      header{align-items:flex-start}
      .badge{display:none}
      .hero{padding-top:55px}
      .quiz-card,.result-box{padding:22px}
      .wa{margin:0 0 10px;width:100%}
      .secondary{width:100%}
    }
  </style>
</head>
<body>

  <div class="wrap">
    <header>
      <div>
        <div class="logo">APEX STRATEGY</div>
        <div class="tag">AGENCIA DE PUBLICIDAD</div>
      </div>
      <div class="badge">QUIZ APEX 01</div>
    </header>

    <main>
      <section class="hero" id="inicio">
        <div class="kicker">HAZ QUE TU MARCA SE NOTE</div>
        <h1>Tu negocio.<br>Una estrategia.</h1>
        <p>
          Responde este quiz de 4 retos y descubre qué recurso publicitario
          puede ayudarte a comunicar mejor tu negocio.
        </p>
        <button class="btn" onclick="startQuiz()">COMENZAR EL QUIZ →</button>
      </section>

      <section class="quiz" id="quiz">
        <div class="quiz-card">
          <div class="progress"><span id="bar"></span></div>
          <div class="counter" id="counter">RETO 1 DE 4</div>
          <h2 id="question"></h2>
          <div class="answers" id="answers"></div>
        </div>
      </section>

      <section class="result" id="result">
        <div class="result-box">
          <div class="result-label">RESULTADO APEX</div>
          <div class="service" id="service"></div>
          <p id="description"></p>
          <div class="chips" id="chips"></div>

          <button class="btn wa" onclick="contact()">HABLAR POR WHATSAPP</button>
          <button class="btn secondary" onclick="restart()">VOLVER A JUGAR</button>
        </div>
      </section>
    </main>

    <footer>© 2026 APEX STRATEGY · AGENCIA DE PUBLICIDAD</footer>
  </div>

<script>
const questions = [
  {
    q:"¿Qué necesita más tu negocio en este momento?",
    a:[
      ["Que más personas conozcan mi negocio","alcance"],
      ["Mostrar mis productos o servicios de forma ordenada","catalogo"],
      ["Promocionar algo y conseguir clientes","campana"],
      ["Tener una imagen más profesional","marca"]
    ]
  },
  {
    q:"¿Dónde sientes que tu negocio puede mejorar?",
    a:[
      ["En mis redes sociales","alcance"],
      ["En la presentación de mis productos","catalogo"],
      ["En mis promociones y anuncios","campana"],
      ["En mi identidad visual","marca"]
    ]
  },
  {
    q:"Si mañana lanzaras una nueva promoción, ¿qué necesitarías?",
    a:[
      ["Piezas para publicar en redes","alcance"],
      ["Una presentación clara de lo que vendo","catalogo"],
      ["Una campaña para difundir la promoción","campana"],
      ["Diseños que mantengan mi imagen de marca","marca"]
    ]
  },
  {
    q:"¿Qué resultado te gustaría conseguir primero?",
    a:[
      ["Mayor presencia en redes","alcance"],
      ["Presentar mejor mis productos","catalogo"],
      ["Atraer clientes con una campaña","campana"],
      ["Construir una imagen más sólida","marca"]
    ]
  }
];

const results = {
  alcance:{
    title:"CONTENIDO PARA REDES",
    desc:"Tu siguiente paso puede ser mejorar la comunicación de tu negocio en redes con piezas visuales claras, atractivas y pensadas para publicar.",
    chips:["Posts","Historias","Piezas digitales"]
  },
  catalogo:{
    title:"CATÁLOGO COMERCIAL",
    desc:"Tu negocio puede beneficiarse de una presentación más ordenada y profesional de tus productos o servicios para facilitar la decisión de compra.",
    chips:["Catálogo digital","Productos","Presentación"]
  },
  campana:{
    title:"CAMPAÑA PROMOCIONAL",
    desc:"Tu prioridad parece estar en comunicar una oferta o promoción. Una campaña puede organizar el mensaje y las piezas necesarias para difundirla.",
    chips:["Anuncios","Banners","Promociones"]
  },
  marca:{
    title:"DISEÑO DE MARCA",
    desc:"Una identidad visual consistente puede ayudarte a presentar tu negocio de manera más profesional y reconocible en tus diferentes piezas.",
    chips:["Identidad visual","Diseño","Piezas publicitarias"]
  }
};

let current=0;
let scores={alcance:0,catalogo:0,campana:0,marca:0};

function startQuiz(){
  document.querySelector(".hero").style.display="none";
  document.getElementById("quiz").classList.add("active");
  current=0;
  scores={alcance:0,catalogo:0,campana:0,marca:0};
  showQuestion();
  window.scrollTo({top:0,behavior:"smooth"});
}

function showQuestion(){
  const item=questions[current];
  document.getElementById("counter").textContent=`RETO ${current+1} DE ${questions.length}`;
  document.getElementById("bar").style.width=((current+1)/questions.length*100)+"%";
  document.getElementById("question").textContent=item.q;

  const box=document.getElementById("answers");
  box.innerHTML="";

  item.a.forEach(([text,key])=>{
    const btn=document.createElement("button");
    btn.className="answer";
    btn.innerHTML=text+"<small>Seleccionar →</small>";
    btn.onclick=()=>{
      scores[key]++;
      current++;
      if(current<questions.length){
        showQuestion();
      }else{
        showResult();
      }
    };
    box.appendChild(btn);
  });
}

function showResult(){
  document.getElementById("quiz").classList.remove("active");
  document.getElementById("result").classList.add("active");

  const winner=Object.keys(scores).reduce((a,b)=>scores[a]>=scores[b]?a:b);
  const data=results[winner];

  document.getElementById("service").textContent=data.title;
  document.getElementById("description").textContent=data.desc;

  const chips=document.getElementById("chips");
  chips.innerHTML="";
  data.chips.forEach(c=>{
    const span=document.createElement("span");
    span.className="chip";
    span.textContent=c;
    chips.appendChild(span);
  });

  window.scrollTo({top:0,behavior:"smooth"});
}

function contact(){
  window.location.href="https://wa.me/51949713213";
}

function restart(){
  document.getElementById("result").classList.remove("active");
  document.querySelector(".hero").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>

</body>
</html>
